      <div class="{{dockSpaceCls}}" style="{{dockSpaceStyle}}" aria-hidden="true"></div>
      <div class="{{dockCls}}">
        <sc-if value="{{dockOpen}}" hint-placeholder-val="{{false}}">
        <div class="{{dockGripCls}}" onPointerDown="{{dockGrip}}" onDoubleClick="{{dockGripReset}}" role="separator" aria-orientation="horizontal" aria-label="ลากเพื่อปรับความสูงรายการ" title="ลากเพื่อปรับความสูง ดับเบิลคลิกเพื่อคืนค่า"><span></span></div>
        <div class="dockbody">
          <div class="rhead"><span>รายการที่เลือก</span><span class="morehint">{{sell.moreHint}}</span><sc-if value="{{sell.hasCart}}" hint-placeholder-val="{{false}}"><button class="link" onClick="{{sell.clear}}">ล้าง</button></sc-if></div>
          <sc-if value="{{sell.isU}}" hint-placeholder-val="{{true}}"><div class="{{lookup.dockLk}}"><strong style="white-space: nowrap">ขายให้</strong><span class="t">{{lookup.dockText}}</span></div></sc-if>
          <div class="dockrows" style="{{dockRowsStyle}}">
          <sc-if value="{{sell.cartEmpty}}" hint-placeholder-val="{{true}}"><div class="empty">แตะสินค้าเพื่อเพิ่มลงรายการ</div></sc-if>
          <sc-for list="{{sell.cart}}" as="c" hint-placeholder-count="2">
            <div class="crow">
              <div class="cname"><sc-if value="{{c.plain}}" hint-placeholder-val="{{false}}">{{c.name}}</sc-if><sc-if value="{{c.sized}}" hint-placeholder-val="{{true}}"><span class="cnm"><span class="cnt">{{c.pname}}</span><button class="{{c.zbCls}}" onClick="{{c.openPick}}" aria-label="เปลี่ยนไซส์">{{c.size}}<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path></svg></button></span></sc-if><div class="cunit small muted"><span>{{c.unit}}</span><sc-if value="{{c.hasWant}}" hint-placeholder-val="{{false}}"><span class="cwant">{{c.wantLabel}}</span></sc-if></div></div>
              <div class="qty"><button class="qb" onClick="{{c.dec}}" aria-label="ลด">−</button><span>{{c.qty}}</span><button class="qb" onClick="{{c.inc}}" aria-label="เพิ่ม">+</button></div>
              <div class="csub">{{c.sub}}</div>
              <sc-if value="{{c.pickOpen}}" hint-placeholder-val="{{false}}"><button class="mscrim2" onClick="{{c.closePick}}" aria-label="ปิด"></button><div class="zpop cpick" style="{{c.pickStyle}}" role="listbox" aria-label="เปลี่ยนไซส์"><span class="zt">เปลี่ยนไซส์ {{c.pname}}</span><span class="zh">ไซส์ที่หมด แตะเพื่อจดว่าลูกค้าต้องการ</span><div class="zrow"><sc-for list="{{c.opts}}" as="o" hint-placeholder-count="4"><button class="{{o.cls}}" onClick="{{o.pick}}"><span class="{{o.tgCls}}">{{o.tag}}</span><b>{{o.size}}</b><small class="{{o.stCls}}">{{o.stk}}</small></button></sc-for></div></div></sc-if>
            </div>
          </sc-for>
          </div>
        </div>
        </sc-if>
        <sc-if value="{{trSheetOpen}}" hint-placeholder-val="{{false}}">
          <button class="trcatch" onClick="{{trCancel}}" aria-label="ปิด"></button>

          <div class="brow cact m"><button class="btn" onClick="{{toPreview}}">ดูสิ่งที่จะเปลี่ยน</button></div>

      </aside>
      </div>
